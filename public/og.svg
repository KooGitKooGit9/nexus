<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="a1" cx="0.18" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="0.9" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="0.6" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#070810"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#a1)"/>
  <rect width="1200" height="630" fill="url(#a2)"/>
  <rect width="1200" height="630" fill="url(#a3)"/>

  <!-- logo -->
  <g transform="translate(80 78)">
    <rect x="-6" y="-6" width="76" height="76" rx="24" fill="url(#brand)" opacity="0.6" filter="url(#blur)"/>
    <rect width="64" height="64" rx="20" fill="url(#brand)"/>
    <path d="M19 47V17l26 30V17" stroke="#fff" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="44" font-family="'Space Grotesk', 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="34" font-weight="700" fill="#eceef8">Nexus</text>
  </g>

  <!-- headline -->
  <g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
    <text x="80" y="268" font-size="70" font-weight="800" fill="#eceef8" letter-spacing="-2">흩어진 업무 도구,</text>
    <text x="80" y="356" font-size="70" font-weight="800" fill="url(#text)" letter-spacing="-2">이제 Nexus 하나로</text>
    <text x="80" y="428" font-size="28" font-weight="500" fill="#989eba">메신저 · 프로젝트 · 문서 · 캘린더 · 전자결재 · AI 비서</text>
  </g>

  <!-- chips -->
  <g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="600">
    <rect x="80" y="486" width="214" height="54" rx="27" fill="url(#brand)"/>
    <text x="187" y="521" text-anchor="middle" fill="#ffffff">무료로 시작하기</text>
    <rect x="310" y="486" width="296" height="54" rx="27" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="458" y="521" text-anchor="middle" fill="#eceef8">멤버 10명까지 무료</text>
  </g>

  <!-- mini product card -->
  <g transform="translate(790 150)">
    <rect width="330" height="330" rx="28" fill="#111321" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="30" cy="30" r="6" fill="#ff5f57"/>
    <circle cx="50" cy="30" r="6" fill="#febc2e"/>
    <circle cx="70" cy="30" r="6" fill="#28c840"/>
    <g font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
      <circle cx="44" cy="86" r="18" fill="#8b5cf6"/>
      <rect x="74" y="72" width="140" height="12" rx="6" fill="#eceef8" fill-opacity="0.85"/>
      <rect x="74" y="92" width="210" height="10" rx="5" fill="#989eba" fill-opacity="0.55"/>
      <circle cx="44" cy="148" r="18" fill="#22d3ee"/>
      <rect x="74" y="134" width="110" height="12" rx="6" fill="#eceef8" fill-opacity="0.85"/>
      <rect x="74" y="154" width="180" height="10" rx="5" fill="#989eba" fill-opacity="0.55"/>
      <rect x="26" y="190" width="278" height="108" rx="18" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.45"/>
      <text x="46" y="224" font-size="17" font-weight="700" fill="#a78bfa">✓ AI가 태스크 3개를 만들었어요</text>
      <rect x="46" y="242" width="12" height="12" rx="3" fill="none" stroke="#989eba"/>
      <rect x="68" y="244" width="150" height="9" rx="4.5" fill="#eceef8" fill-opacity="0.7"/>
      <rect x="46" y="266" width="12" height="12" rx="3" fill="none" stroke="#989eba"/>
      <rect x="68" y="268" width="120" height="9" rx="4.5" fill="#eceef8" fill-opacity="0.7"/>
    </g>
  </g>
</svg>
